<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inversiones Perez</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
    text-align: center;
}
header {
    background-color: #ffffff;
    color: #333;
    padding: 20px;
    border-bottom: 2px solid #ddd;
}
.logo-img {
    max-width: 150px;
    height: auto;
    margin-bottom: 10px;
}
.logo-text {
    font-size: 28px;
    font-weight: bold;
    color: #03045e;
}
.container {
    padding: 20px;
}
.catalog {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
}
.product-card {
    background: white;
    border-radius: 8px;
    padding: 15px;
    width: 90%;
    max-width: 350px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    position: relative;
}
.product-img {
    width: 100%;
    height: 250px;
    object-fit: contain;
    background-color: #f8f9fa;
    border-radius: 5px;
    margin-bottom: 10px;
}
.product-name {
    font-size: 20px;
    font-weight: bold;
    color: #03045e;
    margin-bottom: 5px;
}
.badge-coming {
    display: inline-block;
    background-color: #ff4d4d;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 10px;
    border-radius: 12px;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.btn-buy {
    background-color: #0077b6;
    color: white;
    padding: 10px 20px;
    border-radius: 5px;
    text-decoration: none;
    font-weight: bold;
    display: inline-block;
    margin-top: 10px;
}
.whatsapp-float {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background-color: #25d366;
    color: white;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    text-decoration: none;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
}
</style>
</head>
<body>

<header>
    <img src="IMG_0838.jpeg" alt="Logo Inversiones Perez" class="logo-img">
    <div class="logo-text">INVERSIONES PEREZ</div>
    <p>Tecnologia y Smartphones</p>
</header>

<div class="container">
    <h2>Nuestro Catalogo</h2>

    <div class="catalog">
        <!-- iPhone 12 Pro -->
        <div class="product-card">
            <img src="IMG_2026.jpeg" alt="iPhone 12 Pro" class="product-img">
            <div class="product-name">iPhone 12 Pro</div>
            <div><span class="badge-coming">¡Próximamente disponible!</span></div>
            <a href="https://wa.me/50495248442?text=Hola,%20me%20interesa%20el%20iPhone%2012%20Pro" class="btn-buy" target="_blank">Consultar por WhatsApp</a>
        </div>

        <!-- iPhone 11 Pro 64GB -->
        <div class="product-card">
            <img src="IMG_2051.jpeg" alt="iPhone 11 Pro 64GB" class="product-img">
            <div class="product-name">iPhone 11 Pro (64 GB)</div>
            <div><span class="badge-coming">¡Próximamente disponible!</span></div>
            <a href="https://wa.me/50495248442?text=Hola,%20me%20interesa%20el%20iPhone%2011%20Pro%2064GB" class="btn-buy" target="_blank">Consultar por WhatsApp</a>
        </div>

        <!-- iPhone 11 Pro 256GB -->
        <div class="product-card">
            <img src="IMG_2045.jpeg" alt="iPhone 11 Pro 256GB" class="product-img">
            <div class="product-name">iPhone 11 Pro (256 GB)</div>
            <div><span class="badge-coming">¡Próximamente disponible!</span></div>
            <a href="https://wa.me/50495248442?text=Hola,%20me%20interesa%20el%20iPhone%2011%20Pro%20256GB" class="btn-buy" target="_blank">Consultar por WhatsApp</a>
        </div>
    </div>
</div>

<a href="https://wa.me/50495248442?text=Hola!%20Vengo%20de%20la%20pagina%20y%20quiero%20mas%20informacion." class="whatsapp-float" target="_blank">&#128172;</a>

</body>
</html>
